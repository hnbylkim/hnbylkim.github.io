<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATL 학습접근방법 자가점검</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17203A;
  --ink-60:#5A6480;
  --ink-30:#96A0BC;
  --paper:#F4F6FB;
  --card:#FFFFFF;
  --line:#E1E6F2;
  --c-think:#6B4EFF;
  --c-research:#00A38C;
  --c-comm:#E8912B;
  --c-social:#EC5F8B;
  --c-self:#2D7DF6;
  --shadow:0 2px 4px rgba(23,32,58,.04), 0 12px 28px rgba(23,32,58,.07);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'IBM Plex Sans KR',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  background-image:radial-gradient(var(--line) 1px, transparent 1px);
  background-size:22px 22px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Gowun Dodum',sans-serif;font-weight:400;letter-spacing:-.01em;line-height:1.35}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:500;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 96px}
.screen{display:none;animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
.screen.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- 시작 화면 ---------- */
.cover{padding:56px 0 40px;text-align:center}
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--ink-30);text-transform:uppercase}
.cover h1{font-size:clamp(30px,7vw,46px);margin:14px 0 12px}
.cover p.lead{color:var(--ink-60);font-size:16px;max-width:460px;margin:0 auto}
.cover-art{margin:26px auto 8px;width:180px;height:180px}
.cover-art polygon.ring{fill:none;stroke:var(--line);stroke-width:1.5}
.cover-art path.wedge{opacity:0;animation:pop .5s ease-out forwards}
@keyframes pop{from{opacity:0;transform:scale(.72)}to{opacity:.92;transform:scale(1)}}
.namebox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin:26px auto 0;max-width:440px;text-align:left}
.namebox label{display:block;font-size:13px;font-weight:600;color:var(--ink-60);margin-bottom:8px}
.namebox input{width:100%;font-family:inherit;font-size:16px;color:var(--ink);padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#FBFCFF}
.namebox input:focus{outline:none;border-color:var(--c-think);box-shadow:0 0 0 3px rgba(107,78,255,.14)}
.namebox .field{margin-bottom:14px}
.namebox .field:last-child{margin-bottom:0}
.sendbox{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{font-size:14px;font-weight:500;margin-top:12px;padding:10px 14px;border-radius:12px;display:none}
.status.on{display:block}
.status.ok{background:#E8F7F3;color:#00806E}
.status.err{background:#FDEDF2;color:#D6376B}
.setupnote{font-size:13px;color:var(--ink-60);background:#FBFCFF;border:1px dashed var(--line);border-radius:12px;padding:14px 16px}
.setupnote code{font-family:'IBM Plex Mono',monospace;font-size:12px;background:#EEF1F8;padding:1px 5px;border-radius:5px}
.howto{max-width:440px;margin:22px auto 0;text-align:left;font-size:14px;color:var(--ink-60)}
.howto li{margin:6px 0 6px 18px}

/* ---------- 버튼 ---------- */
.btn{font-family:inherit;font-size:16px;font-weight:600;border:none;border-radius:999px;padding:14px 30px;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
.btn-main{background:var(--ink);color:#fff;box-shadow:0 6px 18px rgba(23,32,58,.22)}
.btn-main:hover{transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--ink-60);border:1.5px solid var(--line);background:var(--card)}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-30)}
.btn:focus-visible{outline:3px solid var(--c-think);outline-offset:3px}
.nav{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:28px}

/* ---------- 헤더(진행 오각형) ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,246,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:760px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.pent{width:44px;height:44px;flex:none}
.pent .slot{fill:var(--line);transition:fill .4s ease}
.pent .outline{fill:none;stroke:#fff;stroke-width:2.5;stroke-linejoin:round}
.topbar .label{flex:1;min-width:0}
.topbar .label b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .label span{font-size:12px;color:var(--ink-30);letter-spacing:.04em}
.count{font-size:13px;color:var(--ink-60);white-space:nowrap}

/* ---------- 척도 안내 ---------- */
.scalebar{position:sticky;top:69px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 14px rgba(23,32,58,.05);margin:18px 0 22px;padding:10px 12px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.scalebar div{font-size:11px;color:var(--ink-60);line-height:1.4}
.scalebar b{display:block;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink)}

/* ---------- 섹션 헤더 ---------- */
.sec-head{padding:26px 0 4px}
.sec-head .tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;color:#fff;padding:4px 12px;border-radius:999px}
.sec-head h2{font-size:clamp(24px,5.5vw,32px);margin:12px 0 6px}
.sec-head p{color:var(--ink-60);font-size:15px}

/* ---------- 문항 ---------- */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px;transition:border-color .2s,box-shadow .2s}
.q.miss{border-color:#EC5F8B;box-shadow:0 0 0 3px rgba(236,95,139,.15)}
.q .qtop{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.q .num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-30)}
.q .sub{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:#F2F4FA;color:var(--ink-60)}
.q .text{font-size:16px;line-height:1.6;margin-bottom:14px}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.opts label{position:relative;display:flex;align-items:center;justify-content:center;height:46px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--ink-30);background:#FBFCFF;transition:all .16s}
.opts input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.opts label:hover{border-color:var(--ink-30);color:var(--ink-60)}
.opts input:focus-visible + span{outline:3px solid var(--c-think);outline-offset:4px;border-radius:8px}
.opts label.sel{background:var(--qcolor,var(--ink));border-color:var(--qcolor,var(--ink));color:#fff;transform:translateY(-1px)}
.warn{display:none;color:#D6376B;font-size:14px;font-weight:500;margin-top:16px}
.warn.on{display:block}

/* ---------- 결과 ---------- */
.res-head{text-align:center;padding:44px 0 8px}
.res-head h1{font-size:clamp(28px,6vw,40px);margin:10px 0 6px}
.res-head .who{color:var(--ink-60);font-size:14px}
.total{display:inline-flex;align-items:baseline;gap:6px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 22px;box-shadow:var(--shadow)}
.total b{font-family:'IBM Plex Mono',monospace;font-size:26px}
.total span{font-size:13px;color:var(--ink-60)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 22px;margin:22px 0}
.panel > h3{font-size:20px;margin-bottom:4px}
.panel > p.note{font-size:14px;color:var(--ink-60);margin-bottom:14px}
#radar{width:100%;height:auto;display:block;max-width:460px;margin:0 auto}
.radar-grid{fill:none;stroke:var(--line);stroke-width:1}
.radar-axis{stroke:var(--line);stroke-width:1}
.radar-area{fill:rgba(45,125,246,.14);stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.radar-lab{font-family:'IBM Plex Sans KR',sans-serif;font-size:12.5px;font-weight:600;fill:var(--ink)}
.radar-val{font-family:'IBM Plex Mono',monospace;font-size:12px;fill:var(--ink-60)}
.radar-tick{font-family:'IBM Plex Mono',monospace;font-size:9.5px;fill:var(--ink-30)}

.catrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.catrow:first-of-type{border-top:none}
.catrow .dot{width:10px;height:10px;border-radius:3px;flex:none}
.catrow .nm{flex:1;font-size:15px;font-weight:500}
.catrow .sc{font-family:'IBM Plex Mono',monospace;font-size:15px}
.catrow .lv{font-size:12px;color:var(--ink-60);width:74px;text-align:right}

.subgrid{margin-top:6px}
.subrow{margin:12px 0}
.subrow .t{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.subrow .t span:last-child{font-family:'IBM Plex Mono',monospace;color:var(--ink-60)}
.track{height:8px;background:#EEF1F8;border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px;width:0;transition:width .9s cubic-bezier(.2,.8,.3,1)}

.grow{border-left:4px solid var(--gcolor,var(--ink));background:#FBFCFF;border-radius:0 14px 14px 0;padding:16px 18px;margin:14px 0}
.grow h4{font-family:'Gowun Dodum',sans-serif;font-size:18px;margin-bottom:2px}
.grow .meta{font-size:12px;color:var(--ink-30);margin-bottom:8px}
.grow .meta b{font-family:'IBM Plex Mono',monospace;color:var(--gcolor,var(--ink))}
.grow p{font-size:14.5px;color:var(--ink-60);margin-bottom:10px}
.grow ul{list-style:none}
.grow li{font-size:14px;padding-left:20px;position:relative;margin:5px 0}
.grow li::before{content:"→";position:absolute;left:0;color:var(--gcolor,var(--ink));font-weight:600}
.strength{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14.5px}
.strength .star{color:var(--c-comm);flex:none}
.summary{font-size:15.5px;line-height:1.8}
.summary em{font-style:normal;font-weight:600;color:var(--ink);border-bottom:2px solid rgba(107,78,255,.28)}

@media (max-width:520px){
  .opts{gap:6px}
  .opts label{height:42px;font-size:14px}
  .scalebar div{font-size:10px}
  .q{padding:16px 14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
@media print{
  body{background:#fff}
  .topbar,.noprint{display:none !important}
  .panel{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>

<!-- 상단 진행 바 -->
<div class="topbar noprint" id="topbar" style="display:none">
  <div class="topbar-in">
    <svg class="pent" id="pent" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <div class="label"><b id="tbName">사고 기능</b><span id="tbStep">1 / 5 단계</span></div>
    <div class="count" id="tbCount">0/15</div>
  </div>
</div>

<div class="wrap">

  <!-- 시작 -->
  <section class="screen on" id="s-intro">
    <div class="cover">
      <div class="eyebrow">IB PYP · Approaches to Learning</div>
      <h1>학습접근방법<br>자가점검</h1>
      <svg class="cover-art" viewBox="0 0 200 200" aria-hidden="true" id="coverArt"></svg>
      <p class="lead">50개의 문장을 읽고, 지금의 나에게 얼마나 가까운지 1~5점으로 표시해 보세요. 다 마치면 다섯 가지 기능의 도달 정도를 오각형 그래프로 보여줍니다.</p>
      <div class="namebox">
        <div class="field">
          <label for="klass">학급</label>
          <input id="klass" type="text" placeholder="예) 6-3" autocomplete="off">
        </div>
        <div class="field">
          <label for="who">이름</label>
          <input id="who" type="text" placeholder="예) 김민서" autocomplete="off">
        </div>
      </div>
      <ul class="howto">
        <li>정답은 없어요. 지금의 나를 솔직하게 표시하면 됩니다.</li>
        <li>한 단계에 한 기능씩, 모두 5단계로 진행돼요.</li>
        <li>결과는 이 화면에만 나타나며 어디에도 저장되지 않아요.</li>
      </ul>
      <div style="margin-top:28px"><button class="btn btn-main" id="start">점검 시작하기</button></div>
    </div>
  </section>

  <!-- 문항 화면들 (JS가 채움) -->
  <div id="sections"></div>

  <!-- 결과 -->
  <section class="screen" id="s-result"></section>

</div>

<script>
/* =========================================================================
   ★ 교사 설정 구역 — 구글폼으로 학급 결과 모으기
   -------------------------------------------------------------------------
   [가장 쉬운 방법] prefillUrl 하나만 붙여넣기
   1) 구글폼에 '단답형' 질문 9개를 이 순서로 만드세요.
      ① 학급 ② 이름 ③ 전체평균 ④ 사고 ⑤ 조사 ⑥ 의사소통 ⑦ 대인관계 ⑧ 자기관리 ⑨ 원자료
   2) 폼 우측 상단 ⋮ → '미리 채워진 링크 만들기'
   3) 각 칸에 위 번호 그대로 1, 2, 3 … 9 를 입력 → [링크 가져오기] → [링크 복사]
   4) 복사한 주소 전체를 아래 prefillUrl 따옴표 안에 붙여 넣으세요. 끝입니다.
      (formId와 entry 번호를 코드가 스스로 읽어냅니다)

   [수동 방법] prefillUrl을 비워 두면 아래 formId / entries 값을 그대로 사용합니다.
   mode: 'prefill' = 학생이 폼 화면에서 [제출]만 누름 (로그인 필요한 폼도 가능, 권장)
         'auto'    = 버튼 한 번으로 백그라운드 전송 (로그인·이메일 수집이 꺼진 폼에서만)
   ========================================================================= */
const CONFIG = {
  prefillUrl: '',                  // ← 여기에 미리 채워진 링크를 통째로 붙여넣으세요
  formId: '1FAIpQLSdc45dA-I7V3a8KbrwMSMtd-j4m20hoO22-JMrBUkriqL-k_Q',
  mode: 'prefill',                 // 'prefill' 또는 'auto'
  entries: {                       // 'entry.' 는 있어도 없어도 자동 처리됩니다
    klass:    'entry.1872109097',  // ① 학급
    name:     'entry.1246670756',  // ② 이름
    total:    'entry.785030855',   // ③ 전체평균
    think:    'entry.1385878064',  // ④ 사고 기능
    research: 'entry.934480914',   // ⑤ 조사 기능
    comm:     'entry.965943083',   // ⑥ 의사소통 기능
    social:   'entry.854540910',   // ⑦ 대인관계 기능
    self:     'entry.721968264',   // ⑧ 자기 관리 기능
    raw:      'entry.1325339213'   // ⑨ 원자료(50문항 점수, 쉼표 구분)
  }
};

/* prefillUrl이 있으면 formId와 entry 번호를 자동으로 읽어옵니다 */
const FIELD_ORDER = ['klass','name','total','think','research','comm','social','self','raw'];
const FIELD_LABEL = {klass:'학급',name:'이름',total:'전체평균',think:'사고',research:'조사',
                     comm:'의사소통',social:'대인관계',self:'자기관리',raw:'원자료'};
(function readPrefillUrl(){
  if(!CONFIG.prefillUrl) return;
  const url=CONFIG.prefillUrl.trim();
  const m=url.match(/\/d\/e\/([^\/?]+)\//);
  if(m) CONFIG.formId=m[1];
  const q=url.split('?')[1]||'';
  const byValue={};
  new URLSearchParams(q).forEach((v,k)=>{ if(k.indexOf('entry.')===0) byValue[v.trim()]=k; });
  const found=[];
  FIELD_ORDER.forEach((f,i)=>{
    const e=byValue[String(i+1)];
    if(e){ CONFIG.entries[f]=e; found.push(FIELD_LABEL[f]); }
  });
  if(found.length<FIELD_ORDER.length){
    console.warn('[ATL] prefillUrl에서 찾지 못한 칸이 있어요. 각 칸에 1~9를 순서대로 넣어 링크를 다시 만들어 주세요. 찾은 칸:',found.join(', '));
  }
})();

/* ===================== 데이터 ===================== */
const CATS = [
  {key:'think',   name:'사고 기능',      short:'사고',   color:'#6B4EFF',
   desc:'자료를 꼼꼼히 따져보고, 새롭게 떠올리고, 배운 것을 옮겨 쓰고, 스스로를 돌아보는 힘'},
  {key:'research',name:'조사 기능',      short:'조사',   color:'#00A38C',
   desc:'필요한 정보를 찾아 정리하고, 온라인 정보를 바르게 다루는 힘'},
  {key:'comm',    name:'의사소통 기능',  short:'의사소통',color:'#E8912B',
   desc:'듣고 말하고 읽고 쓰며, 온라인에서도 생각을 주고받는 힘'},
  {key:'social',  name:'대인관계 기능',  short:'대인관계',color:'#EC5F8B',
   desc:'함께 지내며 협력하고, 서로 다름을 존중하며 갈등을 풀어가는 힘'},
  {key:'self',    name:'자기 관리 기능', short:'자기관리',color:'#2D7DF6',
   desc:'시간과 목표를 스스로 관리하고, 흔들릴 때 마음을 다잡는 힘'}
];

const SUBS = {
  '비판적 사고력':{cat:'think',sum:'자료를 잘게 나누어 살펴보고, 근거를 따져 판단을 내리는 힘이에요.',tips:[
    '자료를 읽은 뒤 가장 중요한 문장 3개를 고르고, 고른 이유를 한 줄씩 적어 보세요.',
    '친구의 의견에 "왜 그렇게 생각했어?"라고 한 번 더 물어보세요.',
    '결론을 내린 다음 "이 결론을 뒷받침한 자료는 무엇이었지?"를 되짚어 보세요.']},
  '창의적 사고력':{cat:'think',sum:'익숙한 것을 새롭게 연결하고, 남들이 떠올리지 못한 방법을 생각해내는 힘이에요.',tips:[
    '하루에 하나씩 "만약에 ~라면?" 질문을 노트에 적어 보세요.',
    '상관없어 보이는 낱말 두 개를 뽑아 억지로 연결해 설명하는 놀이를 해 보세요.',
    '해결 방법이 하나 떠올라도 멈추지 말고 2~3개를 더 적어 보세요.']},

const answers = {};

const $ = s => document.querySelector(s);
const catOf = k => CATS.find(c=>c.key===k);

/* ===================== 오각형 좌표 유틸 ===================== */
function pentPts(cx,cy,r,scale){
  return CATS.map((_,i)=>{
    const a = -Math.PI/2 + i*2*Math.PI/5;
    const rr = r*(scale?scale[i]:1);
    return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)];
  });
}
const ptsStr = p => p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');

/* 표지 오각형 아트 */
(function(){
  const svg = $('#coverArt'), cx=100, cy=100, R=76;
  let h = `<polygon class="ring" points="${ptsStr(pentPts(cx,cy,R))}"/>`;
  h += `<polygon class="ring" points="${ptsStr(pentPts(cx,cy,R*0.6))}"/>`;
  h += `<polygon class="ring" points="${ptsStr(pentPts(cx,cy,R*0.3))}"/>`;
  const p = pentPts(cx,cy,R);
  CATS.forEach((c,i)=>{
    const a=p[i], b=p[(i+1)%5];
    h += `<path class="wedge" style="fill:${c.color};transform-origin:${cx}px ${cy}px;animation-delay:${.15+i*.11}s"
           d="M${cx} ${cy} L${a[0].toFixed(1)} ${a[1].toFixed(1)} L${b[0].toFixed(1)} ${b[1].toFixed(1)} Z"
           opacity=".9"/>`;
  });
  h += `<polygon points="${ptsStr(p)}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>`;
  h += `<line x1="${cx}" y1="${cy}" x2="${p[0][0]}" y2="${p[0][1]}" stroke="#fff" stroke-width="2.5"/>`;
  svg.innerHTML = h;
})();

/* 헤더 진행 오각형 */
(function(){
  const svg=$('#pent'), cx=50, cy=50, R=42, p=pentPts(cx,cy,R);
  let h='';
  CATS.forEach((c,i)=>{
    const a=p[i], b=p[(i+1)%5];
    h += `<path class="slot" data-i="${i}" d="M${cx} ${cy} L${a[0].toFixed(1)} ${a[1].toFixed(1)} L${b[0].toFixed(1)} ${b[1].toFixed(1)} Z"/>`;
  });
  h += `<polygon class="outline" points="${ptsStr(p)}"/>`;
  CATS.forEach((c,i)=>{ h += `<line class="outline" x1="${cx}" y1="${cy}" x2="${p[i][0].toFixed(1)}" y2="${p[i][1].toFixed(1)}"/>`; });
  svg.innerHTML=h;
})();

/* ===================== 문항 화면 생성 ===================== */
const holder = $('#sections');
CATS.forEach((cat,ci)=>{
  const items = ITEMS.filter(it=>it.cat===cat.key);
  const sec = document.createElement('section');
  sec.className='screen'; sec.id='s-'+cat.key;
  let h = `<div class="sec-head">
      <span class="tag" style="background:${cat.color}">${ci+1} / 5 · ${cat.short}</span>
      <h2>${cat.name}</h2>
      <p>${cat.desc}</p>
    </div>
    <div class="scalebar">${SCALE.map(s=>`<div><b>${s.v}</b>${s.t}</div>`).join('')}</div>`;
  items.forEach(it=>{
    h += `<div class="q" id="q${it.id}" style="--qcolor:${cat.color}">
      <div class="qtop"><span class="num">${String(it.id).padStart(2,'0')}</span><span class="sub">${it.sub}</span></div>
      <div class="text">${it.text}</div>
      <div class="opts">${SCALE.map(s=>`
        <label data-q="${it.id}" data-v="${s.v}">
          <input type="radio" name="q${it.id}" value="${s.v}" aria-label="${it.text} — ${s.v}점">
          <span>${s.v}</span>
        </label>`).join('')}</div>
    </div>`;
  });
  h += `<div class="warn" id="w-${cat.key}">아직 답하지 않은 문항이 있어요. 빨간 테두리 문항을 표시해 주세요.</div>
    <div class="nav noprint">
      <button class="btn btn-ghost" data-prev="${ci}">이전</button>
      <button class="btn btn-main" data-next="${ci}">${ci===4?'결과 보기':'다음 단계'}</button>
    </div>`;
  sec.innerHTML=h;
  holder.appendChild(sec);
});

/* 선택 이벤트 */
document.addEventListener('change', e=>{
  const inp = e.target.closest('.opts input'); if(!inp) return;
  const lab = inp.closest('label');
  const qid = +lab.dataset.q;
  answers[qid] = +lab.dataset.v;
  lab.parentElement.querySelectorAll('label').forEach(l=>l.classList.remove('sel'));
  lab.classList.add('sel');
  document.getElementById('q'+qid).classList.remove('miss');
  updateBar();
});

/* ===================== 화면 이동 ===================== */
function show(i){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  step = i;
  if(i===-1){ $('#s-intro').classList.add('on'); $('#topbar').style.display='none'; }
  else if(i===5){ $('#s-result').classList.add('on'); $('#topbar').style.display='none'; }
  else { document.getElementById('s-'+CATS[i].key).classList.add('on'); $('#topbar').style.display='block'; }
  window.scrollTo({top:0,behavior:'instant'});
  updateBar();
}
function updateBar(){
  if(step<0||step>4) return;
  const cat=CATS[step], items=ITEMS.filter(it=>it.cat===cat.key);
  const done=items.filter(it=>answers[it.id]).length;
  $('#tbName').textContent=cat.name;
  $('#tbStep').textContent=`${step+1} / 5 단계`;
  $('#tbCount').textContent=`${done}/${items.length}`;
  document.querySelectorAll('#pent .slot').forEach((el,i)=>{
    const its=ITEMS.filter(it=>it.cat===CATS[i].key);
    const d=its.filter(it=>answers[it.id]).length;
    el.style.fill = d===its.length ? CATS[i].color : (d>0 ? CATS[i].color+'55' : '');
  });
}
$('#start').addEventListener('click',()=>show(0));
document.addEventListener('click', e=>{
  const nx=e.target.closest('[data-next]'), pv=e.target.closest('[data-prev]');
  if(pv){ show(+pv.dataset.prev-1); }
  if(nx){
    const i=+nx.dataset.next, cat=CATS[i];
    const miss=ITEMS.filter(it=>it.cat===cat.key && !answers[it.id]);
    const warn=document.getElementById('w-'+cat.key);
    if(miss.length){
      warn.classList.add('on');
      miss.forEach(m=>document.getElementById('q'+m.id).classList.add('miss'));
      document.getElementById('q'+miss[0].id).scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    warn.classList.remove('on');
    if(i<4) show(i+1); else { buildResult(); show(5); }
  }
});

/* ===================== 결과 ===================== */
const level = v => v>=4.5?'매우 우수':v>=3.8?'우수':v>=3.0?'보통':v>=2.2?'성장 중':'도움 필요';
const round1 = v => Math.round(v*10)/10;

function buildResult(){
  const catAvg={}, subAvg={};
  CATS.forEach(c=>{
    const its=ITEMS.filter(i=>i.cat===c.key);
    catAvg[c.key]=its.reduce((s,i)=>s+answers[i.id],0)/its.length;
  });
  Object.keys(SUBS).forEach(k=>{
    const its=ITEMS.filter(i=>i.sub===k);
    subAvg[k]=its.reduce((s,i)=>s+answers[i.id],0)/its.length;
  });
  const total = ITEMS.reduce((s,i)=>s+answers[i.id],0)/ITEMS.length;
  const sortedCats=[...CATS].sort((a,b)=>catAvg[b.key]-catAvg[a.key]);
  const best=sortedCats[0], worst=sortedCats[4];
  const subKeys=Object.keys(SUBS).sort((a,b)=>subAvg[a]-subAvg[b]);
  const grow=subKeys.filter(k=>subAvg[k]<4.4).slice(0,3);
  const growList = grow.length?grow:subKeys.slice(0,2);
  const strong=[...subKeys].reverse().slice(0,2);

  const who=$('#who').value.trim();
  const klass=$('#klass').value.trim();
  const today=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});

  window.__payload = {
    klass: klass || '미입력',
    name:  who   || '미입력',
    total: round1(total).toFixed(1),
    think: round1(catAvg.think).toFixed(1),
    research: round1(catAvg.research).toFixed(1),
    comm: round1(catAvg.comm).toFixed(1),
    social: round1(catAvg.social).toFixed(1),
    self: round1(catAvg.self).toFixed(1),
    raw: ITEMS.map(i=>answers[i.id]).join(',')
  };
  window.__textSummary =
    `[ATL 자가점검] ${klass||''} ${who||''} (${today})\n`+
    `전체평균 ${round1(total).toFixed(1)}\n`+
    CATS.map(c=>`${c.name} ${round1(catAvg[c.key]).toFixed(1)}`).join(' / ')+'\n'+
    `더 기를 점: ${growList.join(', ')}\n`+
    `원자료: ${ITEMS.map(i=>answers[i.id]).join(',')}`;

  let h = `<div class="res-head">
      <div class="eyebrow">Approaches to Learning · 분석 결과</div>
      <h1>나의 학습접근방법 지도</h1>
      <div class="who">${who?who+' · ':''}${today}</div>
      <div class="total"><b class="mono">${round1(total)}</b><span>/ 5.0 전체 평균</span></div>
    </div>

    <div class="panel">
      <h3>다섯 기능의 도달 정도</h3>
      <p class="note">바깥쪽으로 넓을수록 지금 잘 발휘하고 있는 기능이에요.</p>
      <svg id="radar" viewBox="0 0 420 380" role="img" aria-label="다섯 기능 오각형 그래프"></svg>
      <div style="margin-top:10px">
        ${CATS.map(c=>`<div class="catrow">
          <span class="dot" style="background:${c.color}"></span>
          <span class="nm">${c.name}</span>
          <span class="sc">${round1(catAvg[c.key]).toFixed(1)}</span>
          <span class="lv">${level(catAvg[c.key])}</span>
        </div>`).join('')}
      </div>
    </div>

    <div class="panel">
      <h3>더 길러야 하는 학습접근방법</h3>
      <p class="note">점수가 낮은 순서예요. 한 번에 하나씩만 골라 연습해도 충분합니다.</p>
      ${growList.map(k=>{
        const s=SUBS[k], c=catOf(s.cat);
        return `<div class="grow" style="--gcolor:${c.color}">
          <h4>${k}</h4>
          <div class="meta">${c.name} · <b>${round1(subAvg[k]).toFixed(1)} / 5.0</b> · ${level(subAvg[k])}</div>
          <p>${s.sum}</p>
          <ul>${s.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
        </div>`;}).join('')}
    </div>

    <div class="panel">
      <h3>이미 잘하고 있는 점</h3>
      <p class="note">여기서 쓴 방법을 다른 기능으로 옮겨 써 보세요.</p>
      ${strong.map(k=>`<div class="strength"><span class="star">★</span>
        <span><b>${k}</b> (${round1(subAvg[k]).toFixed(1)}) — ${SUBS[k].sum}</span></div>`).join('')}
      <div class="summary" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line)">
        전체적으로 <em>${best.name}</em>이(가) 가장 잘 발휘되고 있고, <em>${worst.name}</em>에 아직 여유가 있어요.
        특히 <em>${growList[0]}</em>을(를) 먼저 연습하면 ${catOf(SUBS[growList[0]].cat).name} 전체가 함께 올라갑니다.
      </div>
    </div>

    <div class="panel">
      <h3>세부 기능 한눈에 보기</h3>
      <div class="subgrid">
      ${CATS.map(c=>{
        const keys=Object.keys(SUBS).filter(k=>SUBS[k].cat===c.key);
        return keys.map(k=>`<div class="subrow">
          <div class="t"><span>${k}</span><span>${round1(subAvg[k]).toFixed(1)}</span></div>
          <div class="track"><div class="fill" data-w="${(subAvg[k]/5*100).toFixed(1)}" style="background:${c.color}"></div></div>
        </div>`).join('');
      }).join('')}
      </div>
    </div>

    <div class="panel noprint" id="sendPanel">
      <h3>선생님께 결과 보내기</h3>
      <p class="note">이름·학급과 기능별 점수, 문항별 응답이 함께 전송됩니다.</p>
      <div id="sendUI"></div>
      <div class="status" id="sendStatus"></div>
    </div>

    <div class="nav noprint" style="justify-content:center;gap:12px">
      <button class="btn btn-ghost" id="again">다시 점검하기</button>
      <button class="btn btn-main" id="print">결과 인쇄 / PDF 저장</button>
    </div>`;

  $('#s-result').innerHTML=h;
  drawRadar(CATS.map(c=>catAvg[c.key]));
  requestAnimationFrame(()=>{
    document.querySelectorAll('#s-result .fill').forEach((f,i)=>{
      setTimeout(()=>{f.style.width=f.dataset.w+'%';}, 80+i*45);
    });
  });
  renderSendUI();
  $('#print').addEventListener('click',()=>window.print());
  $('#again').addEventListener('click',()=>{
    Object.keys(answers).forEach(k=>delete answers[k]);
    document.querySelectorAll('.opts label').forEach(l=>l.classList.remove('sel'));
    document.querySelectorAll('.opts input').forEach(i=>i.checked=false);
    document.querySelectorAll('.q').forEach(q=>q.classList.remove('miss'));
    document.querySelectorAll('.warn').forEach(w=>w.classList.remove('on'));
    show(-1);
  });
}

/* ---------- 구글폼 전송 ---------- */
function formConfigured(){
  return CONFIG.formId && Object.values(CONFIG.entries).every(v=>v);
}
function entryName(v){
  v=String(v).trim();
  return v.startsWith('entry.') ? v : 'entry.'+v;
}
function buildQuery(){
  const p=window.__payload;
  return FIELD_ORDER
    .map(k=>encodeURIComponent(entryName(CONFIG.entries[k]))+'='+encodeURIComponent(p[k]))
    .join('&');
}
/* 어떤 칸이 연결됐는지 눈으로 확인하는 점검용 링크 (칸마다 그 칸의 이름이 채워짐) */
function checkUrl(){
  const q=FIELD_ORDER
    .map(k=>encodeURIComponent(entryName(CONFIG.entries[k]))+'='+encodeURIComponent('▶'+FIELD_LABEL[k]))
    .join('&');
  return `https://docs.google.com/forms/d/e/${CONFIG.formId}/viewform?usp=pp_url&${q}`;
}
function setStatus(msg,type){
  const el=$('#sendStatus');
  el.textContent=msg;
  el.className='status on '+(type||'ok');
}
function renderSendUI(){
  const box=$('#sendUI');
  if(!formConfigured()){
    box.innerHTML=`<div class="setupnote">아직 구글폼이 연결되지 않았어요.
      선생님은 이 파일을 텍스트 편집기로 열어 위쪽 <code>const CONFIG</code> 부분에
      폼 주소와 <code>entry</code> 번호를 넣어 주세요. 그때까지는 아래 버튼으로 결과를 복사해 전달할 수 있어요.
      </div>
      <div class="sendbox" style="margin-top:12px">
        <button class="btn btn-ghost" id="copyBtn">결과 요약 복사하기</button>
      </div>`;
  } else if(CONFIG.mode==='auto'){
    box.innerHTML=`<div class="sendbox">
        <button class="btn btn-main" id="autoBtn">결과 제출하기</button>
        <button class="btn btn-ghost" id="copyBtn">결과 요약 복사하기</button>
      </div>`;
  } else {
    box.innerHTML=`<div class="sendbox">
        <a class="btn btn-main" id="prefillBtn" target="_blank" rel="noopener"
           href="https://docs.google.com/forms/d/e/${CONFIG.formId}/viewform?usp=pp_url&${buildQuery()}">구글폼 열어서 제출하기</a>
        <button class="btn btn-ghost" id="copyBtn">결과 요약 복사하기</button>
      </div>
      <p class="note" style="margin:12px 0 0">답이 미리 채워진 채로 열립니다. 맨 아래 <b>제출</b>만 누르면 끝이에요.</p>`;
  }
  if(formConfigured()){
    box.insertAdjacentHTML('beforeend',
      `<p class="note" style="margin:10px 0 0;font-size:12px;color:var(--ink-30)">
         선생님용 · <a href="${checkUrl()}" target="_blank" rel="noopener" style="color:inherit">설정 점검하기</a>
         — 칸마다 그 칸의 이름이 채워지면 연결이 정상이에요.
       </p>`);
  }

  const copy=$('#copyBtn');
  if(copy) copy.addEventListener('click',async()=>{
    try{ await navigator.clipboard.writeText(window.__textSummary); setStatus('결과 요약을 복사했어요. 선생님께 붙여넣어 전달하세요.','ok'); }
    catch(e){ setStatus('복사가 막혀 있어요. 결과 화면을 인쇄해서 제출해 주세요.','err'); }
  });

  const auto=$('#autoBtn');
  if(auto) auto.addEventListener('click',()=>{
    auto.disabled=true; auto.textContent='보내는 중…';
    const body=new URLSearchParams();
    const p=window.__payload;
    Object.keys(CONFIG.entries).forEach(k=>body.append(entryName(CONFIG.entries[k]),p[k]));
    fetch(`https://docs.google.com/forms/d/e/${CONFIG.formId}/formResponse`,
      {method:'POST',mode:'no-cors',body})
      .then(()=>{ auto.textContent='제출 완료'; setStatus('제출했어요. 창을 닫아도 괜찮습니다.','ok'); })
      .catch(()=>{ auto.disabled=false; auto.textContent='다시 제출하기';
                   setStatus('전송에 실패했어요. 인터넷 연결을 확인하거나 결과 요약 복사하기를 이용해 주세요.','err'); });
  });
}

function drawRadar(vals){
  const svg=$('#radar'), cx=210, cy=190, R=118;
  let h='';
  for(let k=1;k<=5;k++){
    h += `<polygon class="radar-grid" points="${ptsStr(pentPts(cx,cy,R*k/5))}"/>`;
  }
  const outer=pentPts(cx,cy,R);
  outer.forEach(p=>{ h += `<line class="radar-axis" x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}"/>`; });
  for(let k=1;k<=5;k++){ h += `<text class="radar-tick" x="${cx+4}" y="${cy-R*k/5+3}">${k}</text>`; }

  h += `<polygon class="radar-area" id="area" points="${ptsStr(pentPts(cx,cy,0))}"/>`;
  outer.forEach((p,i)=>{
    h += `<circle id="pt${i}" cx="${cx}" cy="${cy}" r="4.5" fill="${CATS[i].color}" stroke="#fff" stroke-width="2"/>`;
  });
  pentPts(cx,cy,R+34).forEach((p,i)=>{
    const anchor = Math.abs(p[0]-cx)<8 ? 'middle' : (p[0]>cx?'start':'end');
    const dy = p[1]<cy-30 ? -4 : (p[1]>cy+30 ? 12 : 0);
    h += `<text class="radar-lab" x="${p[0].toFixed(1)}" y="${(p[1]+dy).toFixed(1)}" text-anchor="${anchor}">${CATS[i].short}</text>`;
    h += `<text class="radar-val" x="${p[0].toFixed(1)}" y="${(p[1]+dy+15).toFixed(1)}" text-anchor="${anchor}">${round1(vals[i]).toFixed(1)}</text>`;
  });
  svg.innerHTML=h;

  const area=svg.querySelector('#area');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce?0:800, t0=performance.now();
  (function frame(t){
    const k = dur? Math.min(1,(t-t0)/dur) : 1;
    const e = 1-Math.pow(1-k,3);
    const scale = vals.map(v=>(v/5)*e);
    const pts = pentPts(cx,cy,R,scale);
    area.setAttribute('points', ptsStr(pts));
    pts.forEach((p,i)=>{
      const c=svg.querySelector('#pt'+i);
      c.setAttribute('cx',p[0].toFixed(1)); c.setAttribute('cy',p[1].toFixed(1));
    });
    if(k<1) requestAnimationFrame(frame);
  })(t0);
}
</script>
